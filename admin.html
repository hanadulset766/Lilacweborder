<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Lilacmart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">💜 Lilacmart Admin</div>
  <a class="admin-link" href="index.html">Toko</a>
</header>

<main class="container narrow">
  <section id="loginView" class="login-card">
    <div class="avatar">🔐</div>
    <h1>Login Admin</h1>
    <p class="muted">Masuk untuk mengelola produk demo.</p>
    <form id="loginForm">
      <label>Username<input id="username" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary full">Masuk</button>
      <p id="loginError" class="error"></p>
    </form>
    <div class="demo-box"><b>Demo:</b> admin / Admin123!</div>
  </section>

  <section id="dashboard" class="hidden">
    <div class="section-head">
      <div><h1>Dashboard</h1><p class="muted">Kelola produk yang tampil di toko.</p></div>
      <button class="btn danger" onclick="logoutAdmin()">Keluar</button>
    </div>

    <div class="stats">
      <div><span>Produk</span><strong id="statProducts">0</strong></div>
      <div><span>Pesanan demo</span><strong id="statOrders">0</strong></div>
    </div>

    <section class="panel">
      <h2>Tambah Produk</h2>
      <form id="productForm" class="form-grid">
        <label>Nama Produk<input id="pName" required></label>
        <label>Harga (Rp)<input id="pPrice" type="number" min="0" required></label>
        <label>Emoji/Gambar<input id="pImage" value="🛍️"></label>
        <button class="btn primary">Tambah</button>
      </form>
    </section>

    <section class="panel">
      <h2>Daftar Produk</h2>
      <div id="adminProducts"></div>
    </section>
  </section>
</main>

<footer>Panel admin demo • GitHub Pages</footer>
<script src="admin.js"></script>
</body>
</html>
