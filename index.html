<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d9a6c0">
  <title>Lilacmart - Auto Order</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Lilacmart</div>
    <button id="cartBtn" class="cart-btn">🛒 Keranjang <span id="cartCount">0</span></button>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">WELCOME TO</p>
        <h1>Lilacmart</h1>
        <p>Belanja mudah, checkout cepat, pembayaran QRIS.</p>
        <a href="#products" class="primary">Belanja Sekarang</a>
      </div>
    </section>

    <section id="products" class="section">
      <h2>Produk</h2>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <div id="cartModal" class="modal hidden">
    <div class="modal-card">
      <button class="close" data-close>×</button>
      <h2>Keranjang</h2>
      <div id="cartItems"></div>
      <div class="total">Total: <strong id="cartTotal">Rp0</strong></div>
      <button id="checkoutBtn" class="primary full">Checkout</button>
    </div>
  </div>

  <div id="checkoutModal" class="modal hidden">
    <div class="modal-card">
      <button class="close" data-close>×</button>
      <h2>Data Pesanan</h2>
      <form id="orderForm">
        <label>Nama
          <input id="customerName" required>
        </label>
        <label>Nomor WhatsApp
          <input id="customerPhone" type="tel" required>
        </label>
        <label>Alamat
          <textarea id="customerAddress" required></textarea>
        </label>
        <button class="primary full" type="submit">Lanjut ke Pembayaran</button>
      </form>
    </div>
  </div>

  <div id="paymentModal" class="modal hidden">
    <div class="modal-card payment">
      <button class="close" data-close>×</button>
      <h2>Pembayaran QRIS</h2>
      <p>Scan QRIS berikut menggunakan aplikasi pembayaran kamu.</p>
      <img src="qris.jpg" class="qris" alt="QRIS Lilacmart">
      <p class="total">Total: <strong id="paymentTotal">Rp0</strong></p>
      <button id="confirmPaymentBtn" class="primary full">Saya Sudah Bayar</button>
    </div>
  </div>

  <div id="successModal" class="modal hidden">
    <div class="modal-card center">
      <div class="success-icon">✓</div>
      <h2>Pesanan berhasil dibuat</h2>
      <p id="orderMessage"></p>
      <button class="primary full" data-close>OK</button>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="online-db.js"></script>
  <script src="aplikasi.js"></script>
</body>
</html>
