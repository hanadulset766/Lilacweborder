<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lilacmart Store — Auto Order QRIS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#faf7ff;color:#241b35}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee7f7;z-index:5}.nav,main{max-width:1050px;margin:auto;padding:14px 16px}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:900;color:#6d28d9}.brand small{display:block;font-size:11px;color:#777}.cart,.add,.primary{border:0;background:#8b5cf6;color:white;border-radius:12px;padding:11px 14px;font-weight:800}.hero{background:linear-gradient(135deg,#eadcff,#fff);border:1px solid #e7d9ff;border-radius:24px;padding:25px;margin:5px 0 18px}.hero h1{margin:0 0 8px}.hero p{color:#776d86}.search{width:100%;padding:14px;border:1px solid #eee7f7;border-radius:14px;font-size:15px}.categories{display:flex;gap:8px;overflow:auto;padding:14px 0}.chip{white-space:nowrap;border:1px solid #e4d9f1;background:#fff;border-radius:99px;padding:9px 14px;font-weight:800}.chip.active{background:#8b5cf6;color:#fff}.title{display:flex;justify-content:space-between}.count{color:#777}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.product{background:#fff;border:1px solid #eee7f7;border-radius:18px;padding:13px}.pic{height:125px;border-radius:14px;background:#f5efff;display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.product h3{margin:10px 0 5px;font-size:15px}.desc{font-size:12px;color:#777;min-height:32px}.price{font-weight:900;color:#6d28d9;margin:8px 0}.status{font-size:11px;color:#16834b;font-weight:800;margin-bottom:8px}.add{width:100%}.empty,.loading{text-align:center;padding:40px;background:#fff;border:1px dashed #ddd0ed;border-radius:18px;grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:min(600px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.close{float:right;border:0;border-radius:50%;padding:8px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.total{display:flex;justify-content:space-between;font-weight:900;font-size:18px;padding:14px 0}input,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #eee7f7;border-radius:11px;font:inherit}.primary{width:100%}.secondary{width:100%;padding:12px;margin-top:8px;background:white;border:1px solid #ddd0ed;border-radius:12px;color:#6d28d9;font-weight:800}.qris{width:230px;display:block;margin:10px auto;max-width:100%}@media(max-width:850px){.products{grid-template-columns:repeat(2,1fr)}} 
</style></head><body>
<header><div class="nav"><div class="brand">🌸 Lilacmart Store<small>Auto Order • QRIS</small></div><button class="cart" onclick="openCart()">🛒 <b id="cartCount">0</b></button></div></header>
<main><section class="hero"><h1>Belanja Digital Lebih Mudah ✨</h1><p>Pilih produk, masukkan data, lalu bayar dengan QRIS.</p></section>
<input id="search" class="search" placeholder="🔎 Cari produk..." oninput="renderProducts()"><div id="categories" class="categories"></div>
<div class="title"><h2>📦 Katalog Produk</h2><span id="readyCount">(memuat...)</span></div><section id="products" class="products"><div class="loading">⏳ Memuat produk...</div></section></main>
<div id="cartModal" class="modal"><div class="sheet"><button class="close" onclick="closeModal('cartModal')">×</button><h2>🛒 Keranjang</h2><div id="cartItems"></div><div class="total"><span>Total</span><b id="cartTotal">Rp0</b></div><button class="primary" onclick="openCheckout()">Lanjut Pembayaran</button></div></div>
<div id="checkoutModal" class="modal"><div class="sheet"><button class="close" onclick="closeModal('checkoutModal')">×</button><h2>💜 Checkout</h2><label>Nama</label><input id="customerName" placeholder="Nama kamu"><label>No. WhatsApp</label><input id="customerPhone" placeholder="08xxxxxxxxxx"><label>Catatan</label><textarea id="customerNote"></textarea><div class="total"><span>Total</span><b id="checkoutTotal">Rp0</b></div><button class="primary" onclick="createOrder()">Bayar dengan QRIS</button></div></div>
<div id="qrisModal" class="modal"><div class="sheet"><button class="close" onclick="closeModal('qrisModal')">×</button><h2>💳 Bayar dengan QRIS</h2><b id="invoiceNo"></b><img class="qris" src="qris.jpg" onerror="this.src='qris-placeholder.svg'"><div class="total"><span>Total</span><b id="qrisTotal">Rp0</b></div><button class="primary" onclick="sendWhatsApp()">Kirim konfirmasi WhatsApp</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="online-db.js"></script><script src="aplikasi.js"></script>
</body></html>
